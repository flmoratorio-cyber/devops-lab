---
# Install Docker Engine from the official repository on all workers.
# Idempotent: a second run should report changed=0.
- name: Install and configure Docker Engine
  hosts: servers
  become: true
  vars:
    docker_user: "{{ ansible_user }}"

  tasks:
    - name: Remove conflicting distro packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - docker-buildx
          - podman-docker
          - containerd
          - runc
        state: absent

    - name: Install base utilities
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: false

    - name: Create the APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure the Docker repository (DEB822)
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/ubuntu
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        architectures: ["{{ ansible_facts['architecture'] | regex_replace('x86_64', 'amd64') }}"]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker Engine and plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add the automation user to the docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
