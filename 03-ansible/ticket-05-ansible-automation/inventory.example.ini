# Lab inventory (example). Copy to inventory.ini and adjust.
[control_plane]
master ansible_connection=local

[servers]
wk1
wk2
wk3
wk4

[k8s_cluster:children]
control_plane
servers

[servers:vars]
ansible_user=<user>
ansible_ssh_private_key_file=~/.ssh/lab_master
ansible_become=true
ansible_become_method=sudo

[all:vars]
ansible_python_interpreter=/usr/bin/python3
