---
# Kubernetes node prerequisites: swap off, kernel modules, sysctl.
# Target: every node (control plane + workers). Idempotent and reboot-safe.
- name: Prepare nodes for Kubernetes
  hosts: k8s_cluster
  become: true

  tasks:
    - name: Disable swap now (only if active)
      ansible.builtin.command: swapoff -a
      changed_when: true
      when: ansible_facts['swaptotal_mb'] | int > 0

    - name: Comment out swap entries in /etc/fstab (survives reboots)
      ansible.builtin.replace:
        path: /etc/fstab
        # \s+ matches tabs AND runs of spaces between fstab columns
        regexp: '^(?!#)(\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Persist kernel modules to load at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Load kernel modules now
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Enable forwarding and bridge netfilter
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/k8s.conf
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward
